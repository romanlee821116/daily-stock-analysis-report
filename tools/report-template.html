<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{RUN_DATE}} 主動式ETF 資金流分析報告</title>
<!--
================================================================================
  ETF 每日分析報告 — 版面樣板（唯一真相來源）
  由 SOP「ETF每日追蹤 SOP（自動排程用）」第 6 節指定一律套用。
  排程產報告時：只替換 {{...}} 佔位，CSS 與結構一律不得改動、不得自行增減章節。

  佔位符：
    «RUN_DATE»    run_date YYYYMMDD（台北時間 Asia/Taipei 的排程觸發日），同時是檔名 reports/«RUN_DATE».html
    «SUBLINE»     標題下方那一行：run_date / as_of / 總規模
    «LEDE_CLASS»  全體淨額 < 0 填 "lede down"，>= 0 填 "lede"
    «LEDE»        一句話結論內文（開頭固定 <b>一句話結論：</b>）
    «KPIS»        固定 6 張卡，順序不可變：
                    全體淨買賣超 / 最大流入主題 / 最大流出主題 /
                    最強共識買盤 / 最強共識賣壓 / 當日無異動
    «SECTIONS»    第 1~7 節，編號與標題固定：
                    1. 產業主題資金流（18 類，依淨額排序）
                    2. 個股淨買超 / 淨賣超前 10
                    3. 多檔共識訊號（同方向 ≥ 3 檔）
                    4. 00981A 專章（規模 X 億，占全體 Y%）
                    5. 其他值得注意的操作
                    6. 全體 22 檔淨買賣超一覽
                    7. 方法與注意事項
    «FOOTER»      資料來源與免責

  KPI 卡片一律三層，長字串放 .n，不得塞進 .v（.v 是 21px 大字，會換行破版）：
    <div class="kpi"><div class="k">標籤</div>
      <div class="v pos|neg">短值</div>
      <div class="n">補充小字</div></div>

  長條圖兩種：
    置中發散（主題、22 檔一覽）：
      <div class="axis"><div class="bar pos|neg" style="width:N%"></div><div class="mid"></div></div>
      N = |值| / 該表最大絕對值 * 50
    靠左（個股排行）：
      <div class="axis l"><div class="bar pos|neg" style="width:N%"></div></div>
      N = |值| / 該表最大絕對值 * 100

  表格一律包 <div class="scroll"> 以便手機橫向捲動。數字欄加 class="num"。
================================================================================
-->
<style>
:root{--bg:#fcfcfb;--fg:#1f1f1e;--dim:#6b6b66;--line:#e4e4df;--card:#ffffff;--pos:#2a78d6;--neg:#e34948;--posbg:#2a78d61a;--negbg:#e349481a}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--fg:#ececea;--dim:#9a9a94;--line:#333331;--card:#232321;--pos:#3987e5;--neg:#e66767}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:1040px;margin:0 auto;padding:40px 16px 80px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:19px;margin:44px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
h3{font-size:15px;margin:22px 0 8px;color:var(--dim)}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:22px}
.lede{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pos);border-radius:7px;padding:16px 18px;margin:22px 0}
.lede.down{border-left-color:var(--neg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:12px 14px}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.kpi .v{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .n{font-size:12.5px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dim{color:var(--dim)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.lbl{white-space:nowrap}
.barcell{width:46%;min-width:150px}
.axis{position:relative;height:15px;background:transparent}
.axis .mid{position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--line)}
.axis .bar{position:absolute;top:2px;height:11px;border-radius:2px}
.axis .bar.pos{left:50%;background:var(--pos)}
.axis .bar.neg{right:50%;background:var(--neg)}
.axis.l .bar{left:0;right:auto}
.axis.l .bar.neg{left:0;right:auto;background:var(--neg)}
ul{padding-left:20px} li{margin:5px 0}
.note{font-size:13px;color:var(--dim)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--line);color:var(--dim);margin-right:4px}
.scroll{overflow-x:auto}
code{font-size:12.5px;background:var(--line);padding:1px 5px;border-radius:3px}
</style>
</head><body><div class="wrap">
<h1>{{RUN_DATE}} 主動式ETF 資金流分析報告</h1>
<div class="sub">{{SUBLINE}}</div>

<div class="{{LEDE_CLASS}}">
{{LEDE}}
</div>

<div class="kpis">
{{KPIS}}
</div>

{{SECTIONS}}

<p class="note" style="margin-top:34px">{{FOOTER}}</p>
</div></body></html>
